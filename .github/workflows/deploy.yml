name: Deploy Esteban IA por SFTP (DESACTIVADO - el sitio ahora se sirve desde Railway)

# DESACTIVADO: el sitio se sirve desde Railway (ver server.js en la raiz) y se
# redespliega solo con cada push a main. Este workflow queda solo como
# respaldo manual por si algun dia hubiera que volver al hosting StackCP
# (se puede lanzar a mano desde la pestaña "Actions").
#
# Nota: se usa SFTP (puerto 22) en vez de FTP normal porque StackCP corta la
# conexión de datos FTP cuando viene desde IPs de datacenters como las de
# GitHub Actions (funciona bien en FTP normal desde una red doméstica, pero
# no desde la nube). SFTP usa un solo canal y no tiene ese problema.
on:
  workflow_dispatch:

# El blog automatico puede hacer varios commits seguidos en una sola
# publicacion (pagina, portada, indice, manifiesto, sitemap, borrar
# borrador) -- esto obliga a que los despliegues se procesen en orden, uno
# a la vez, para que uno mas rapido no sobrescriba a uno mas lento y viejo.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  sftp-deploy:
    name: Subir sitio al hosting
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo -- lo necesita el paso de "git diff" mas abajo

      - name: Armar carpeta solo con los archivos que van al hosting
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js .htaccess google-apps-script.js robots.txt sitemap.xml dist/
          cp -r css js images dist/
          [ -d blog ] && cp -r blog dist/ || echo "Sin carpeta blog/ todavia, se omite"

      - name: Crear carpetas nuevas en el servidor (SFTP-Deploy-Action no las crea en modo sftp_only)
        # Las credenciales se pasan por variables de entorno (sshpass -e) en
        # vez de incrustarlas en el comando: si la contrasena tiene $, comillas
        # o \ el shell la rompia y la conexion fallaba al instante.
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          [ -z "$SSHPASS" ] && echo "ERROR: el secreto FTP_PASSWORD esta vacio o no existe en este repositorio" && exit 1
          [ -z "$FTP_USER" ] && echo "ERROR: el secreto FTP_USERNAME esta vacio o no existe" && exit 1
          [ -z "$FTP_HOST" ] && echo "ERROR: el secreto FTP_SERVER esta vacio o no existe" && exit 1
          which sshpass > /dev/null 2>&1 || sudo apt-get install -y sshpass
          sshpass -e sftp -oStrictHostKeyChecking=no -oBatchMode=no -oConnectTimeout=20 -P 22 "$FTP_USER@$FTP_HOST" << 'EOF'
          -mkdir /public_html/blog
          -mkdir /public_html/blog/drafts
          -mkdir /public_html/blog/posts
          bye
          EOF

      - name: Subir por SFTP a public_html
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: '/public_html/'
          sftp_only: true

      # El "delete_remote_files" de la accion de arriba necesita el canal
      # "exec" de SSH para comparar archivos, y StackCP lo bloquea (mismo
      # motivo que el paso de crear carpetas de arriba) -- por eso se hace
      # aparte, con -rm en modo batch de sftp puro, que si esta permitido.
      # Solo aplica en push normal (no en un workflow_dispatch manual, que
      # no trae "before").
      - name: Borrar en el servidor los archivos que se borraron en este push
        if: github.event_name == 'push'
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          DELETED=$(git diff --name-only --diff-filter=D "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
          if [ -z "$DELETED" ]; then
            echo "No hay archivos borrados en este push."
          else
            echo "Archivos a borrar en el servidor:"
            echo "$DELETED"
            {
              echo "$DELETED" | while IFS= read -r f; do
                [ -n "$f" ] && echo "-rm /public_html/$f"
              done
              echo "bye"
            } > /tmp/sftp_delete_batch.txt
            sshpass -e sftp -oStrictHostKeyChecking=no -oBatchMode=no -P 22 -b /tmp/sftp_delete_batch.txt "$FTP_USER@$FTP_HOST"
          fi
